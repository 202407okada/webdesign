<!DOCTYPE html>
<html iang="ja">
  <head>
    <meta charset="UTF-8">
    <title>マテリアルスイーツ</title>
    <style>
      /* ぺージ全体　CSS */
      body{
         font-size:16px;
         background-color:ivory;
         background-image:url(images/gold_back.jpg);
         background-repeat:repeat-y;
      }
      /* リセット　CSS */
      h1,h2,h3,ul,li,p{
         margin:0;
         padding:0;
      }
      /* ヘッダー　CSS */
      header{
         width:640px;
         background-color:bisque;
      }
      h1{
         margin-left:20px;
         font-size:32px;
         color:crimson;
      }
      header p{margin-left:20px;}
      /* ナビゲーション　CSS */
      nav{background-color:burlywood;}
      /* メインコンテンツ　CSS */
      main{
        width:620px;
        padding-top:10px;
        padding-bottom:10px;
        padding-left:20px;
        background-color:antiquewhite;
      }
      h2{
         font-size:24px;
         color:darkred;
      }
      h3{
         font-size:20px;
         color:brown;
      }
      /* フッター　CSS */
      footer{
         width:600px;
         padding:20px;
         background-color:bisque;
      }
    </style>
  </head>
  <body>
    <header>
        <h1>マテリアルスイーツ</h1>
        <p>伝統と素材にこだわった季節のフルーツを使用したきせつの使用した季節のスイーツのお店です。</p>
        <img src="images/header.jpg" alt="金のモンブランヘッター画像">
        <nav>
           <ul>
              <li><a href="#blanc">モンブラン</a></li>
              <li><a href="#macron">マカロン</a></li>
           </ul>
        </nav>
    </header>
    <main>
     <article>
       <h2>ピックアップスイーツ</h2>
       <p>今月のお勧めスイーツを2つ紹介します。</p>
       <section>
          <h3 id="blanc">モンブラン</h3>
          <p>今年採れた国内産の栗を使用したケーキです。</p>
          <img src="images/blanc1.jpg" alt="モンブランの写真">
       </section>
       <section>
          <h3 id="macron">マカロン</h3>
          <p>沖縄産の砂糖を使用したマカロンです。</p>
          <img src="images/macron1.jpg" alt="macron" />
      </section>
   </article>
</main>

    <footer>
       <small>&copy; 2028 Material Sweets.</small>
    </footer>
  </body>
</html>
